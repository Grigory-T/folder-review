[project]
name = "folder-review"
version = "0.3.0"
description = "Create a recursive XLSX inventory of a folder and its nested archives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "olefile==0.47",
    "openpyxl==3.1.5",
    "py7zr==1.1.3",
    "rarfile==4.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
