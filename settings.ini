# Edit this file in Notepad, save it, then run SETUP.bat.
# UTF-8 and UTF-16 (with BOM) are supported. No Python syntax is needed.

[review]
# Folder to inspect: a local path, UNC path, or mapped SMB drive.
# Paste the path after '='. Quoted paths are accepted. Leave backslashes as-is.
folder =

# off = quick inventory; filtered = exact duplicate candidates; all = full hashes.
duplicates = filtered

# auto, or a number from 1 to 64.
workers = auto

# Report filename only. The report always stays beside SETUP.bat.
report = folder-review.xlsx

# yes/no. Advanced filesystem columns are usually unnecessary.
full_metadata = no

# yes/no. Neutral diagnostic logs stay under support/state/logs.
diagnostics = yes

# Archive limits: 0 disables the byte/time limit. Defaults match previous releases.
max_expanded_gib = 100
max_archive_seconds = 21600
max_rows = 1048570
