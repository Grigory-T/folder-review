name: Windows portable setup and scanner checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the pinned developer uv
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pin=(Get-Content portable/pins.json -Raw|ConvertFrom-Json).uv
          $archive=Join-Path $env:RUNNER_TEMP 'uv.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $pin.url -OutFile $archive
          if((Get-FileHash $archive).Hash.ToLowerInvariant() -ne $pin.archive_sha256){throw 'uv archive hash mismatch'}
          $tools=Join-Path $env:RUNNER_TEMP 'uv-tools'
          Expand-Archive $archive $tools
          if((Get-FileHash (Join-Path $tools 'uv.exe')).Hash.ToLowerInvariant() -ne $pin.exe_sha256){throw 'uv executable hash mismatch'}
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the source-only ZIP
        run: python scripts/build_portable.py --release
      - name: Cold setup, offline starts, relocation and protected input
        shell: powershell
        run: ./tests/windows_portable.ps1 -Zip ./dist/folder-review-windows-x64.zip -Results ./dist/portable-acceptance.json
      - name: Prepare an isolated regression environment
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $case=Get-ChildItem dist -Directory -Filter acceptance-*|Sort-Object CreationTime -Descending|Select-Object -First 1
          $tool=Join-Path $case.FullName ('tool '+[char]0x00e9)
          $uv=Join-Path $tool 'support/state/uv.exe'
          $python=Join-Path $tool 'support/state/python/cpython-3.13.16-windows-x86_64-none/python.exe'
          New-Item -ItemType Directory -Force .build|Out-Null
          & $uv export --frozen --all-groups --no-emit-project --output-file .build/test-requirements.txt
          if($LASTEXITCODE){exit $LASTEXITCODE}
          & $uv --no-config venv --python $python .build/test-venv
          if($LASTEXITCODE){exit $LASTEXITCODE}
          & $uv --no-config pip install --python .build/test-venv/Scripts/python.exe --require-hashes --only-binary :all: --no-deps -r .build/test-requirements.txt
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $env:PATH=(Join-Path $tool 'support/state/backend')+';'+$env:PATH
          & .build/test-venv/Scripts/python.exe -B scripts/run_tests.py --results dist/source-tests.json
          if($LASTEXITCODE){exit $LASTEXITCODE}
          git show v0.18.0:folder_review.py | Out-File .build/baseline.py -Encoding utf8
          & .build/test-venv/Scripts/python.exe -B tests/report_parity.py --tool $tool --baseline .build/baseline.py --results dist/report-parity.json
          exit $LASTEXITCODE
